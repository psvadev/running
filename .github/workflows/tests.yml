# Runs the four Playwright suites on every push, so a regression is caught even when the pre-commit
# routine gets skipped — which, in maintenance mode with weeks between changes, it eventually will.
#
# Scope is deliberate: the Python ports in tests/ (splits_port, pr_port, ...) are NOT run here. They
# use real training sessions as fixtures and stay gitignored — see .gitignore. balcheck.py is also
# absent by construction: it diffs the working file against git HEAD, so on a clean checkout it would
# pass vacuously forever. Both remain part of the local `python tests/run_all.py` gate.
name: tests

on:
  push:
    branches:
      - main
      # ci-test/** exists so the "prove it can actually go RED" check can be repeated on a throwaway
      # branch without touching main. A CI job nobody has ever seen fail is worth less than no CI.
      - 'ci-test/**'
    paths:
      - 'puls.html'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    # Windows on purpose: the layout assertions (402 px mobile overflow, "the event row stays on one
    # line") depend on font metrics, and Linux has a different font stack. Free for public repos.
    runs-on: windows-latest
    # Raised from 20 on 2026-09-05: the run for 75362a6 was cancelled at exactly 20m. Not a hang —
    # timed locally, all 15 suites total ~3 min — the job had grown past its budget as suites were
    # added. WebKit is cached below, which is the real fix; this is the headroom so a cold cache or
    # a slow runner does not read as a failure. ⚠️ A cancelled job is not a passing one: pre-push had
    # run everything locally, so the red here was CI capacity, not the code.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      # The steps below are named one per suite so a failure names itself in the log — but a hand
      # written list rots. The pre-push hook's identical list went stale the first time a suite was
      # added (test_calculators, 2026-08-09) and quietly ran four of five. That hook now globs; this
      # one cannot, so it is guarded instead: every tests/test_*.py must be referenced by a step, or
      # the job fails BEFORE the slow WebKit install. Counting would not be enough — five files and
      # five steps can still be the wrong five.
      - name: Guard - every suite is actually run
        shell: pwsh
        run: |
          $wf = Get-Content .github/workflows/tests.yml -Raw
          $missing = @(Get-ChildItem tests/test_*.py | Where-Object {
            $wf -notmatch [regex]::Escape("python tests/$($_.Name)") } | ForEach-Object { $_.Name })
          if ($missing.Count) {
            Write-Host "::error::Suite(s) with no run step: $($missing -join ', '). Add a step to tests.yml."
            exit 1
          }
          Write-Host "OK - all $((Get-ChildItem tests/test_*.py).Count) suites have a run step."

          # And no suite may hardcode an absolute path. test_charts.py was promoted from a scratch
          # probe that opened "c:\temp\GitHub\running\puls.html" — valid on the author's machine, absent
          # on this runner, so it died in 1s while passing locally every time. The lookbehind keeps
          # "https://" from matching. Same spirit as the check above: fail here, before the WebKit
          # install, rather than 2 minutes in with a cryptic navigation error.
          # ⚠️ The drive letter must be preceded by a QUOTE. The looser '(?<![A-Za-z])[A-Za-z]:[\\/]'
          # this replaces flagged the literal "Repeat the following 3x:\n" in a Runna prescription
          # fixture — "x" + ":" + the backslash of an escape — and turned CI red over a false positive.
          # A hardcoded path always opens with a quote, so requiring one costs nothing in coverage:
          # both "c:\temp\..." and 'C:/Users/...' still match. Falsified both ways before committing.
          $abs = @(Get-ChildItem tests/test_*.py | Where-Object {
            (Get-Content $_.FullName -Raw) -match '["''][A-Za-z]:[\\/]' } | ForEach-Object { $_.Name })
          if ($abs.Count) {
            Write-Host "::error::Suite(s) hardcoding an absolute path: $($abs -join ', '). Derive it from __file__, like every other suite."
            exit 1
          }
          Write-Host "OK - no suite hardcodes an absolute path."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (pip)
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      # Resolved rather than hardcoded so the cache key follows the version pip actually installed —
      # a new Playwright expects a different WebKit build, and a stale cache would be worse than none.
      - name: Resolve Playwright version
        id: pw
        shell: pwsh
        run: |
          $v = python -c "import importlib.metadata as m; print(m.version('playwright'))"
          "v=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "playwright $v"

      # ⚠️ Added 2026-09-05 after the job was CANCELLED at timeout-minutes 20. Nothing hung — the
      # suites total ~3 min locally and the slowest is 41 s — the job had simply grown past its
      # budget, and the largest single cost is downloading WebKit on a Windows runner every run.
      # Cache it; `playwright install` below is then a no-op on a hit.
      - name: Cache WebKit
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-webkit-${{ steps.pw.outputs.v }}

      - name: Install WebKit
        run: playwright install webkit

      # One step per suite: the log then shows which one broke, instead of a single opaque result.
      # Each suite sys.exit(1)s on any failed assertion.
      - name: Denne uken / Ukentlig oversikt
        run: python tests/test_weeknow.py

      - name: Tempo and km/t converter
        run: python tests/test_paceconv.py

      - name: Venue-exclusive fields
        run: python tests/test_venue_fields.py

      - name: Races and additive .ics import
        run: python tests/test_race_events.py

      - name: Verktoy calculators
        run: python tests/test_calculators.py

      - name: Innsikter gating
        run: python tests/test_insights.py

      - name: Strava-gated controls
        run: python tests/test_strava_gating.py

      - name: AI/TSV export blocks
        run: python tests/test_export.py

      - name: Distance goal times
        run: python tests/test_goals.py

      - name: Kommende blokker
        run: python tests/test_blocks.py

      - name: RPE half-steps
        run: python tests/test_rpe.py

      - name: Shoe wear thresholds
        run: python tests/test_shoes.py

      - name: Mål km overlay + removed chart cards
        run: python tests/test_charts.py

      - name: Tab nav — desktop unchanged, bottom bar on phones
        run: python tests/test_nav.py

      - name: Event markers — which charts draw them
        run: python tests/test_event_markers.py
